<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>S2-D4 提詞</title>
<style>
  :root { --ink: #21281F; --muted: #66705F; --diet: #C2620A; }
  body { margin: 0; background: #FFFDF7; color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  header { position: sticky; top: 0; background: var(--diet); color: #fff;
    padding: 14px 24px; font-size: 22px; font-weight: 700; }
  ol { margin: 0; padding: 14px 18px 20px 56px; }
  li { font-size: 25px; line-height: 1.4; font-weight: 700; margin: 0 0 12px; }
  li::marker { color: var(--diet); }
  li small { display: block; font-size: 18px; color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<header>聽到「叮」再開始・每句之間停 1 秒・念完等結束提示音</header>
<ol>
  <li>外食族看過來：自助餐、便當，到底怎麼夾才對？</li>
  <li>記住一個餐盤公式就好。</li>
  <li>第一，盤子的一半，放蔬菜。</li>
  <li>第二，四分之一，放豆魚蛋肉，也就是蛋白質。</li>
  <li>第三，主食最多四分之一，而且飯要減半。</li>
  <li>麵最好不要點——麵吸湯又吸油，一碗很容易就吃完。</li>
  <li>在家自己煮，可以把白飯換成糙米。</li>
  <li>主食少掉的份量，用蛋白質和蔬菜補飽。</li>
  <li>夾的順序也很重要：先夾菜，再夾肉，最後才添飯。</li>
  <li>順序對了，份量自然就對。</li>
  <li>自助餐、便當，都用同一個公式。</li>
</ol>
</body>
</html>
